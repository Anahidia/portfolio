<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bordeaux-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Base rounded square badge -->
  <rect width="512" height="512" rx="120" fill="url(#bordeaux-grad)"/>

  <!-- Subtle refined highlight border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ffffff" stroke-width="16" opacity="0.2"/>

  <!-- Monogram "a." -->
  <text
    x="256"
    y="288"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#ffffff"
    font-family="'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
    font-weight="800"
    font-size="330"
    letter-spacing="-10"
  >a.</text>
</svg>
