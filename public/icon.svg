<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A23"/>
      <stop offset="100%" stop-color="#030014"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#E879F9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer background container -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Glowing border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#brand-grad)" stroke-width="18" opacity="0.9"/>
  
  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="160" fill="#8B5CF6" opacity="0.25" filter="url(#glow)" />

  <!-- Monogram "A" with stylized code brackets -->
  <path d="M 256 120 L 150 380 L 208 380 L 230 320 L 282 320 L 304 380 L 362 380 Z M 256 200 L 268 272 L 244 272 Z" fill="url(#brand-grad)"/>

  <!-- Sparkle Star Accent -->
  <path d="M 370 110 C 370 135 390 155 415 155 C 390 155 370 175 370 200 C 370 175 350 155 325 155 C 350 155 370 135 370 110 Z" fill="#F472B6"/>
</svg>
